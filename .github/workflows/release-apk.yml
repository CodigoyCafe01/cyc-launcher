# Compila el APK y crea un GitHub Release con él.
#
# Se ejecuta:
#   - al subir un tag que empiece por "v" (por ejemplo: git tag v10 && git push origin v10)
#   - a mano desde la pestaña Actions > "Release APK" > Run workflow, indicando el tag
#     (si el tag no existe, se crea sobre la rama elegida).
name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag del release (por ejemplo v9)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/CyCLaunch-${TAG}-debug.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: CyCLaunch ${{ env.TAG }}
          prerelease: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            APK de instalación directa (build debug) generado desde `${{ github.sha }}`.

            Está firmado con el certificado **debug**: si el radio tiene la versión de Google Play,
            desinstálala antes (las firmas no coinciden).

            Instalar por USB o red:
            ```
            adb install -r CyCLaunch-${{ env.TAG }}-debug.apk
            ```
